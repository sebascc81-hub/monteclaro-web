<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monteclaro Inmobiliaria S.A.S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-monteclaro-blue { background-color: #2638bf; }
        .text-monteclaro-blue { color: #2638bf; }
        .bg-monteclaro-silver { background-color: #b2b8bf; }
        .border-monteclaro-silver { border-color: #b2b8bf; }
        
        body { color: #000000; letter-spacing: -0.02em; overflow-x: hidden; }
        .nav-link { font-weight: 900; text-transform: uppercase; font-size: 0.75rem; color: #000000; letter-spacing: 0.1em; transition: 0.3s; cursor: pointer; }
        .nav-link:hover { color: #2638bf; }
        
        /* --- ESTILOS MENÚ FLOTANTE INTEGRADOS --- */
        .nav-item { position: relative; display: inline-block; }
        .dropdown-content { 
            display: none; position: absolute; background-color: #ffffff; 
            min-width: 220px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); z-index: 100;
            text-align: left; border-top: 4px solid #2638bf; top: 100%; left: 0;
        }
        .dropdown-content a { color: #000000; padding: 12px 16px; text-decoration: none; display: block; font-size: 11px; font-weight: 800; border-bottom: 1px solid #f1f1f1; text-transform: uppercase; transition: 0.2s; }
        .dropdown-content a:hover { background-color: #f8f8f8; color: #2638bf; padding-left: 20px; }
        .nav-item:hover .dropdown-content { display: block; }
        /* ---------------------------------------- */

        .property-card { border: 1px solid #b2b8bf; background: white; cursor: pointer; transition: 0.3s ease-in-out; }
        .property-card:hover { transform: translateY(-8px); border-color: #2638bf; }
        
        label { color: white; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; display: block; margin-bottom: 2px; }
        .form-label { color: #000000; font-size: 11px; margin-bottom: 4px; display: block; font-weight: 900; }
        select, input, textarea { border-radius: 0px !important; font-weight: 700; font-size: 11px; border: 1px solid #000000; text-transform: uppercase; padding: 10px; width: 100%; }
        
        .hidden { display: none; }
        html { scroll-behavior: smooth; }

        #main-photo { transition: opacity 0.4s ease-in-out; width: 100%; height: 100%; object-fit: cover; }
        .thumb-img { cursor: pointer; transition: 0.2s; border: 2px solid transparent; width: 45px; height: 45px; md:width: 80px; md:height: 80px; object-fit: cover; }
        .thumb-img:hover { border-color: #2638bf; }

        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; padding: 15px; cursor: pointer; transition: 0.3s; z-index: 10; font-size: 12px; }
        .nav-arrow:hover { background: #2638bf; }

        .detail-item { font-size: 11px; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid #f0f0f0; padding: 8px 0; display: flex; justify-content: space-between; }
        .feature-item { font-size: 11px; text-transform: uppercase; font-weight: 700; color: #444; margin-bottom: 6px; }
        .feature-item::before { content: "▪"; color: #2638bf; margin-right: 8px; font-weight: 900; }
    </style>
</head>
<body class="bg-white font-sans">

    <nav class="bg-white sticky top-0 z-50 border-b-2 border-monteclaro-silver shadow-sm">
        <div class="container mx-auto px-4 py-5 flex flex-col lg:flex-row justify-between items-center gap-6 text-center">
            <img src="img/logo2.png" class="h-8 md:h-10 cursor-pointer" onclick="window.location.href='index.html'" onerror="this.src='https://via.placeholder.com/150x40?text=MONTECLARO'">
            
            <div class="flex flex-wrap justify-center gap-6">
                <a onclick="renderHome()" class="nav-link">Inicio</a>
                
                <div class="nav-item">
                    <span onclick="filterByBusiness('Venta')" class="nav-link text-monteclaro-blue">Ventas <i class="fas fa-chevron-down ml-1 text-[8px]"></i></span>
                    <div class="dropdown-content" id="drop-ventas"></div>
                </div>

                <div class="nav-item">
                    <span onclick="filterByBusiness('Alquiler')" class="nav-link">Alquileres <i class="fas fa-chevron-down ml-1 text-[8px]"></i></span>
                    <div class="dropdown-content" id="drop-alquileres"></div>
                </div>

                <a href="https://wa.me/57TUNUMERO" class="nav-link">Permutar</a>
                <a href="#" class="nav-link">Blog</a>
                <a href="#" class="nav-link">Nuestra Empresa</a>
                <a href="#contacto" class="nav-link">Contáctenos</a>
            </div>
        </div>
    </nav>

    <main id="main-view">
        <header id="inicio" class="bg-monteclaro-blue py-12 md:py-20 px-4 border-b-[8px] md:border-b-[12px] border-black text-center">
            <div class="container mx-auto text-black">
                <div class="mb-8 md:mb-12">
                    <img src="img/logo.png" alt="Monteclaro Inmobiliaria S.A.S" class="mx-auto max-w-[200px] sm:max-w-[300px] md:max-w-[450px] h-auto drop-shadow-xl" onerror="this.style.display='none'">
                    <h1 class="text-white font-black text-2xl uppercase md:hidden" id="fallback-text"></h1>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 md:gap-5 text-left" id="filters-container"></div>
                <div class="mt-8 flex justify-center md:justify-end">
                    <button onclick="applyFilters()" class="bg-black text-white px-10 md:px-16 py-4 font-black uppercase text-xs tracking-widest hover:bg-white hover:text-black transition-all shadow-2xl w-full md:w-auto">Buscar Propiedad</button>
                </div>
            </div>
        </header>

        <section id="propiedades" class="container mx-auto py-24 px-4 text-center">
            <div class="text-center mb-16 text-black">
                <h2 class="text-4xl font-black uppercase italic tracking-tighter text-black">PORTAFOLIO <span class="text-monteclaro-blue font-black text-black">EXCLUSIVO</span></h2>
                <div class="h-1.5 w-24 bg-monteclaro-blue mx-auto mt-4"></div>
            </div>
            <div id="properties-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10"></div>
        </section>
    </main>

    <main id="detail-view" class="hidden container mx-auto py-16 px-4 text-black font-black uppercase">
        <button onclick="renderHome()" class="mb-10 text-[10px] font-black uppercase border-b-4 border-monteclaro-blue pb-1 tracking-widest text-black">
            <i class="fas fa-long-arrow-alt-left mr-2"></i> Volver al Catálogo
        </button>
        <div id="detail-content"></div>
    </main>

    <footer class="bg-black text-white py-20 px-4 border-t-[16px] border-monteclaro-blue text-center">
        <div class="container mx-auto">
            <img src="img/logo.png" alt="Logo" class="h-10 md:h-12 mx-auto mb-4 opacity-80 grayscale brightness-200" onerror="this.style.display='none'">
            <h3 class="text-2xl font-black mb-6 uppercase tracking-tighter italic">MONTECLARO INMOBILIARIA S.A.S</h3>
        </div>
    </footer>

    <script>
        const propiedades = [
            { 
                id: 1, titulo: "Casa Campestre Cerritos - Malabar", ciudad: "Pereira", localidad: "Cerritos", zona: "Malabar", 
                tipo: "Casa Campestre", estado: "Usado", negocio: "Venta", alcobas: 6, banos: 7, precio: 3800000000, area: 2033,
                areaConstruida: 675, garaje: 15, estrato: 5, admin: 350000,
                descripcionLarga: "Ubicada en Pereira, Risaralda. Terreno de 2033 m² con privacidad inigualable.",
                internas: ["Admite mascotas", "Jacuzzi"],
                externas: ["Piscina", "Vigilancia"],
                fotos: ["img/propiedad1/IMG_9114.JPG", "img/propiedad1/IMG_9116.JPG"],
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            }
        ];

        let slideshowInterval, currentPhotoIndex = 0, currentProperty;

        function updateNavDropdowns() {
            const types = [...new Set(propiedades.map(p => p.tipo))].sort();
            const fill = (id, negocio) => {
                const container = document.getElementById(id);
                container.innerHTML = '';
                types.forEach(t => {
                    const count = propiedades.filter(p => p.tipo === t && p.negocio === negocio).length;
                    if(count > 0) container.innerHTML += `<a onclick="filterByExactType('${t}', '${negocio}')">${t} (${count})</a>`;
                });
            };
            fill('drop-ventas', 'Venta');
            fill('drop-alquileres', 'Alquiler');
        }

        function filterByExactType(tipo, negocio) {
            document.getElementById('main-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            const filtrados = propiedades.filter(p => p.tipo === tipo && p.negocio === negocio);
            renderGrid(filtrados);
            document.getElementById('propiedades').scrollIntoView();
        }

        function filterByBusiness(negocio) {
            document.getElementById('main-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            const filtrados = propiedades.filter(p => p.negocio.toLowerCase() === negocio.toLowerCase());
            renderGrid(filtrados);
            document.getElementById('propiedades').scrollIntoView();
        }

        function checkRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) renderDetail(parseInt(id)); else renderHome();
        }

        function renderHome() {
            stopSlideshow();
            document.getElementById('main-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            updateNavDropdowns();
            populateFilters();
            renderGrid(propiedades);
            window.scrollTo(0,0);
        }

        function renderGrid(data) {
            const grid = document.getElementById('properties-grid');
            grid.innerHTML = '';
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="property-card flex flex-col h-full" onclick="window.location.search = '?id=${p.id}'">
                        <div class="h-56 overflow-hidden bg-gray-200">
                            <img src="${p.fotos[0]}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-6 flex-grow text-left text-black font-black uppercase">
                            <p class="text-2xl font-black leading-none">$${p.precio.toLocaleString()}</p>
                            <h4 class="text-monteclaro-blue font-black text-[12px] mt-4 uppercase h-10 overflow-hidden leading-tight">${p.titulo}</h4>
                        </div>
                    </div>`;
            });
        }

        function changeMainImage(index) {
            currentPhotoIndex = index;
            const mainPhoto = document.getElementById('main-photo');
            if (mainPhoto) {
                mainPhoto.style.opacity = 0;
                setTimeout(() => {
                    mainPhoto.src = currentProperty.fotos[currentPhotoIndex];
                    mainPhoto.style.opacity = 1;
                }, 400);
            }
        }

        function nextPhoto() { changeMainImage((currentPhotoIndex + 1) % currentProperty.fotos.length); resetSlideshow(); }
        function prevPhoto() { changeMainImage((currentPhotoIndex - 1 + currentProperty.fotos.length) % currentProperty.fotos.length); resetSlideshow(); }
        function startSlideshow() { if (currentProperty && currentProperty.fotos.length > 1) slideshowInterval = setInterval(nextPhoto, 4500); }
        function stopSlideshow() { clearInterval(slideshowInterval); }
        function resetSlideshow() { stopSlideshow(); startSlideshow(); }

        function renderDetail(id) {
            currentProperty = propiedades.find(x => x.id === id);
            if (!currentProperty) return renderHome();
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            
            document.getElementById('detail-content').innerHTML = `
                <div class="grid lg:grid-cols-2 gap-16 text-left mb-20">
                    <div>
                        <div class="relative group h-[550px] overflow-hidden border-b-8 border-monteclaro-blue shadow-2xl mb-6 bg-gray-100">
                            <img id="main-photo" src="${currentProperty.fotos[0]}" class="w-full h-full object-cover">
                            <div class="nav-arrow left-0" onclick="prevPhoto()"><i class="fas fa-chevron-left"></i></div>
                            <div class="nav-arrow right-0" onclick="nextPhoto()"><i class="fas fa-chevron-right"></i></div>
                        </div>
                    </div>
                </div>`;
            startSlideshow();
        }

        function populateFilters() {
            const c = document.getElementById('filters-container');
            const fields = ['ciudad', 'localidad', 'zona', 'tipo', 'estado', 'negocio', 'alcobas', 'banos'];
            c.innerHTML = '';
            fields.forEach(f => {
                const list = [...new Set(propiedades.map(p => p[f]))].sort();
                let opts = `<option value="">Todos</option>`;
                list.forEach(i => opts += `<option value="${i}">${i.toUpperCase()}</option>`);
                c.innerHTML += `<div class="space-y-1"><label>${f.toUpperCase()}:</label><select id="f-${f}">${opts}</select></div>`;
            });
        }

        function applyFilters() {
            const g = (id) => document.getElementById(id).value;
            const res = propiedades.filter(p => (g('f-ciudad') === "" || p.ciudad === g('f-ciudad')));
            renderGrid(res);
            document.getElementById('propiedades').scrollIntoView();
        }

        checkRoute();
    </script>
</body>
</html>
