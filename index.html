<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monteclaro Inmobiliaria SAS | Portafolio 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Tipografía y Colores monteclaro */
        .bg-monteclaro-blue { background-color: #2638bf; }
        .text-monteclaro-blue { color: #2638bf; }
        .bg-monteclaro-silver { background-color: #b2b8bf; }
        .border-monteclaro-silver { border-color: #b2b8bf; }
        
        body { color: #000000; letter-spacing: -0.02em; }
        .nav-link { font-weight: 900; text-transform: uppercase; font-size: 0.75rem; color: #000000; letter-spacing: 0.1em; transition: 0.3s; }
        .nav-link:hover { color: #2638bf; }
        
        .property-card { border: 1px solid #b2b8bf; background: white; cursor: pointer; transition: 0.3s ease-in-out; }
        .property-card:hover { transform: translateY(-8px); border-color: #2638bf; }
        
        /* Estilos de Formulario y Filtros */
        label { color: white; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; }
        .form-label { color: #000000; font-size: 11px; margin-bottom: 4px; display: block; }
        select, input, textarea { border-radius: 0px !important; font-weight: 700; font-size: 11px; border: 1px solid #000000; text-transform: uppercase; padding: 10px; width: 100%; }
        
        .hidden { display: none; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-white font-sans">

    <nav class="bg-white sticky top-0 z-50 border-b-2 border-monteclaro-silver shadow-sm">
        <div class="container mx-auto px-4 py-5 flex flex-col lg:flex-row justify-between items-center gap-6">
            <h1 class="text-2xl font-black tracking-tighter cursor-pointer" onclick="window.location.href='index.html'">
                <span class="text-monteclaro-blue">MONTECLARO</span> <span class="italic">SAS</span>
            </h1>
            <div class="flex flex-wrap justify-center gap-6">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="#propiedades" class="nav-link">Ventas</a>
                <a href="#propiedades" class="nav-link">Alquileres</a>
                <a href="https://wa.me/57TUNUMERO" class="nav-link">Permutar</a>
                <a href="#" class="nav-link">Blog</a>
                <a href="#" class="nav-link">Nuestra Empresa</a>
                <a href="https://wa.me/57TUNUMERO?text=Deseo%20contactar%20con%20un%20asesor" class="nav-link">Contáctenos</a>
            </div>
        </div>
    </nav>

    <main id="main-view">
        <header id="inicio" class="bg-monteclaro-blue py-10 px-4 border-b-[12px] border-black">
            <div class="container mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-5" id="filters-container"></div>
                <div class="mt-8 flex justify-end">
                    <button onclick="applyFilters()" class="bg-black text-white px-16 py-4 font-black uppercase text-xs tracking-widest hover:bg-white hover:text-black transition-all shadow-2xl">Buscar Propiedad</button>
                </div>
            </div>
        </header>

        <section id="propiedades" class="container mx-auto py-24 px-4 text-center">
            <div class="text-center mb-16">
                <h2 class="text-4xl font-black uppercase italic tracking-tighter">PORTAFOLIO <span class="text-monteclaro-blue">EXCLUSIVO</span></h2>
                <div class="h-1.5 w-24 bg-monteclaro-blue mx-auto mt-4"></div>
            </div>
            <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10"></div>
        </section>
    </main>

    <main id="detail-view" class="hidden container mx-auto py-16 px-4">
        <button onclick="window.location.href='index.html'" class="mb-10 text-[10px] font-black uppercase border-b-4 border-monteclaro-blue pb-1 hover:pr-4 transition-all tracking-widest">
            <i class="fas fa-long-arrow-alt-left mr-2"></i> Volver al Catálogo
        </button>
        <div id="detail-content"></div>
    </main>

    <footer class="bg-black text-white py-16 px-4 border-t-[16px] border-monteclaro-blue text-center">
        <div class="container mx-auto">
            <h3 class="text-2xl font-black mb-6 uppercase tracking-tighter italic">CONSULTORÍA HABITACIONAL MONTECLARO</h3>
            <p class="text-monteclaro-silver text-[11px] max-w-2xl mx-auto leading-loose uppercase font-bold tracking-widest opacity-80">
                Proyección 2026: SMMLV $1.750.905. Gestión de subsidios hasta $52.527.150 para viviendas VIS hasta $262.635.000.
            </p>
        </div>
    </footer>

    <script>
        const propiedades = [
            { 
                id: 1, 
                titulo: "Casa de Lujo en Cerritos", 
                ciudad: "Pereira", localidad: "Cerritos", zona: "Malabar", 
                tipo: "Casa Campestre", estado: "Nuevo", negocio: "Venta", 
                alcobas: 5, banos: 6, precio: 3800000000, area: 4500,
                descripcion: "Propiedad de alto nivel con seguridad privada, acabados importados y amplias zonas sociales ideales para el descanso.",
                fotos: ["img/propiedad1/IMG_9114.JPG", "img/propiedad1/IMG_9116.JPG"],
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            },
            { 
                id: 2, 
                titulo: "Apartamento Sector Guadalupe", 
                ciudad: "Pereira", localidad: "Cuba", zona: "Guadalupe", 
                tipo: "Apartamento", estado: "Usado", negocio: "Venta", 
                alcobas: 3, banos: 2, precio: 210000000, area: 62,
                descripcion: "Ubicación estratégica cerca a transporte público y zonas comerciales. Ideal para familias jóvenes.",
                fotos: ["img/propiedad2/foto1.jpg"],
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            }
        ];

        function checkRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) renderDetail(parseInt(id)); else renderHome();
        }

        function renderHome() {
            document.getElementById('main-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            populateFilters();
            renderGrid(propiedades);
        }

        function renderGrid(data) {
            const grid = document.getElementById('properties-grid');
            grid.innerHTML = '';
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="property-card flex flex-col h-full" onclick="window.location.search = '?id=${p.id}'">
                        <div class="h-56 overflow-hidden bg-gray-200">
                            <img src="${p.fotos[0]}" class="w-full h-full object-cover" 
                                 onerror="this.src='https://via.placeholder.com/600x400?text=IMAGEN+EN+CARGA...'">
                        </div>
                        <div class="p-6 flex-grow text-left">
                            <p class="text-2xl font-black text-black leading-none">$${p.precio.toLocaleString()}</p>
                            <h4 class="text-monteclaro-blue font-black text-[12px] mt-4 uppercase h-10 overflow-hidden leading-tight">${p.titulo}</h4>
                        </div>
                        <div class="grid grid-cols-3 text-center p-4 text-[10px] font-black border-t border-monteclaro-silver bg-slate-50 uppercase tracking-tighter">
                            <div>ÁREA <br><span class="text-monteclaro-blue text-xs">${p.area}m²</span></div>
                            <div class="border-x border-monteclaro-silver">HAB <br><span class="text-monteclaro-blue text-xs">${p.alcobas}</span></div>
                            <div>BAÑOS <br><span class="text-monteclaro-blue text-xs">${p.banos}</span></div>
                        </div>
                    </div>`;
            });
        }

        function renderDetail(id) {
            const p = propiedades.find(x => x.id === id);
            if (!p) return renderHome();
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            const dc = document.getElementById('detail-content');
            
            const esVIS = p.precio <= 262635750 ? `<div class="bg-green-600 text-white p-4 text-[11px] font-black uppercase mb-8 tracking-widest text-center shadow-lg">PROPIEDAD APTA PARA SUBSIDIOS DE VIVIENDA 2026</div>` : '';

            dc.innerHTML = `
                <div class="grid lg:grid-cols-2 gap-16 text-left">
                    <div>
                        <img src="${p.fotos[0]}" class="w-full h-[550px] object-cover shadow-2xl mb-6 border-b-8 border-monteclaro-blue" onerror="this.src='https://via.placeholder.com/800x600?text=FOTO...'">
                        <div class="flex flex-wrap gap-3 mb-10">
                            ${p.fotos.map(f => `<img src="${f}" class="h-24 w-24 object-cover border-2 border-monteclaro-silver">`).join('')}
                        </div>
                        <h3 class="font-black uppercase text-xs mb-4 tracking-widest">Descripción Técnica</h3>
                        <p class="text-gray-600 text-sm leading-loose mb-12 text-justify italic font-medium">${p.descripcion}</p>
                        <div class="aspect-video bg-gray-100 shadow-2xl border-4 border-black">
                            <iframe width="100%" height="100%" src="${p.video}" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>

                    <div class="flex flex-col">
                        <span class="text-monteclaro-blue font-black text-xs uppercase tracking-[0.3em] mb-4">${p.negocio} | ${p.tipo}</span>
                        <h2 class="text-5xl font-black uppercase tracking-tightest leading-none mb-6">${p.titulo}</h2>
                        <p class="text-5xl font-black text-black mb-8 leading-none">$${p.precio.toLocaleString()}</p>
                        ${esVIS}
                        
                        <div class="bg-white p-8 border border-monteclaro-silver shadow-2xl mt-4">
                            <h3 class="text-lg font-black uppercase mb-6 border-b-2 border-monteclaro-blue inline-block">Contáctanos</h3>
                            <p class="font-black uppercase text-[10px] text-gray-500 mb-8 tracking-widest">¿Prefieres que te contactemos?</p>
                            
                            <form class="space-y-5">
                                <div>
                                    <label class="form-label font-black">Tu nombre <span class="text-red-600">*</span></label>
                                    <input type="text" placeholder="ESCRIBE TU NOMBRE" required>
                                </div>
                                <div>
                                    <label class="form-label font-black">Correo electrónico <span class="text-red-600">*</span></label>
                                    <input type="email" placeholder="ESCRIBE TU CORREO" required>
                                </div>
                                <div>
                                    <label class="form-label font-black">Número de teléfono <span class="text-red-600">*</span></label>
                                    <div class="flex gap-2">
                                        <select class="w-24 bg-gray-50 text-[10px] font-black"><option>🇨🇴 +57</option></select>
                                        <input type="tel" placeholder="ESCRIBE TU TELÉFONO" class="flex-1" required>
                                    </div>
                                </div>
                                <div>
                                    <label class="form-label font-black">Mensaje <span class="text-red-600">*</span></label>
                                    <textarea rows="4" placeholder="ESTOY INTERESADO EN: ${p.titulo.toUpperCase()}" required></textarea>
                                </div>
                                <div class="flex items-start gap-3">
                                    <input type="checkbox" class="w-4 h-4 mt-1 border-2 border-black" required>
                                    <span class="text-[9px] font-bold uppercase text-gray-400">Acepto recibir información sobre ofertas de Monteclaro SAS</span>
                                </div>
                                <button type="submit" class="w-full bg-black text-white py-5 font-black uppercase text-xs tracking-widest hover:bg-monteclaro-blue transition-all">Enviar mensaje</button>
                            </form>
                            
                            <div class="mt-8 pt-8 border-t border-gray-100 flex justify-between items-center">
                                <a href="https://wa.me/573332581313?text=Interés%20en:%20${p.titulo}" class="text-monteclaro-blue font-black text-[10px] uppercase hover:underline"><i class="fab fa-whatsapp mr-2"></i>WhatsApp Directo</a>
                                <p class="text-[9px] font-bold text-gray-400 uppercase">Ref: 2026-MC-${p.id}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function populateFilters() {
            const c = document.getElementById('filters-container');
            const fields = ['ciudad', 'localidad', 'zona', 'tipo', 'estado', 'negocio', 'alcobas', 'banos'];
            c.innerHTML = '';
            fields.forEach(f => {
                const list = [...new Set(propiedades.map(p => p[f]))].sort();
                let opts = `<option value="">Todos</option>`;
                list.forEach(i => opts += `<option value="${i}">${i}</option>`);
                c.innerHTML += `<div class="space-y-1"><label>${f}:</label><select id="f-${f}">${opts}</select></div>`;
            });
            c.innerHTML += `<div class="space-y-1"><label>Mínimo:</label><input type="number" id="f-min" placeholder="DESDE"></div>`;
            c.innerHTML += `<div class="space-y-1"><label>Máximo:</label><input type="number" id="f-max" placeholder="HASTA"></div>`;
        }

        function applyFilters() {
            const g = (id) => document.getElementById(id).value;
            const res = propiedades.filter(p => {
                return (g('f-ciudad') === "" || p.ciudad === g('f-ciudad')) &&
                       (g('f-min') === "" || p.precio >= Number(g('f-min'))) &&
                       (g('f-max') === "" || p.precio <= Number(g('f-max')));
            });
            renderGrid(res);
            window.location.href = "#propiedades";
        }

        checkRoute();
    </script>
</body>
</html>
