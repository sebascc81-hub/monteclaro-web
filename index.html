<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monteclaro Inmobiliaria SAS | Buscador Avanzado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-monteclaro-blue { background-color: #2638bf; }
        .text-monteclaro-blue { color: #2638bf; }
        .bg-monteclaro-silver { background-color: #b2b8bf; }
        .border-monteclaro-silver { border-color: #b2b8bf; }
        .nav-link { font-weight: 800; text-transform: uppercase; font-size: 0.85rem; color: #000000; transition: color 0.3s; }
        .nav-link:hover { color: #2638bf; }
        .property-card { border: 1px solid #b2b8bf; background: white; transition: transform 0.3s; }
        .property-card:hover { transform: translateY(-5px); }
        .btn-search { background-color: #000000; color: #ffffff; font-weight: 800; transition: all 0.3s; }
        .btn-search:hover { background-color: #2638bf; }
        html { scroll-behavior: smooth; }
        label { color: white; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        select, input { border-radius: 0px !important; font-weight: 600; font-size: 12px; }
    </style>
</head>
<body class="bg-white font-sans text-black">

    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-monteclaro-silver">
        <div class="container mx-auto px-4 py-6 flex flex-col lg:flex-row justify-between items-center gap-6">
            <h1 class="text-2xl font-black tracking-tighter">
                <span class="text-monteclaro-blue">MONTECLARO</span> <span class="text-black italic">SAS</span>
            </h1>
            <div class="flex flex-wrap justify-center gap-4 md:gap-8">
                <a href="#inicio" class="nav-link">Inicio</a>
                <a href="#propiedades" class="nav-link">Ventas</a>
                <a href="#propiedades" class="nav-link">Alquileres</a>
                <a href="#" class="nav-link">Permutar</a>
                <a href="#" class="nav-link">Blog</a>
                <a href="#" class="nav-link">Nuestra Empresa</a>
                <a href="#contacto" class="nav-link">Contáctenos</a>
            </div>
        </div>
    </nav>

    <header id="inicio" class="bg-monteclaro-blue py-8 px-4 border-b-8 border-black">
        <div class="container mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <div class="space-y-1">
                    <label>Ciudad:</label>
                    <select id="f-ciudad" class="w-full p-2 outline-none"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label>Localidad:</label>
                    <select id="f-localidad" class="w-full p-2 outline-none"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label>Zona / barrio:</label>
                    <select id="f-zona" class="w-full p-2 outline-none"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label>Tipo de inmueble:</label>
                    <select id="f-tipo" class="w-full p-2 outline-none"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label>Estado Propiedad:</label>
                    <select id="f-estado" class="w-full p-2 outline-none"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label>Tipo de negocio:</label>
                    <select id="f-negocio" class="w-full p-2 outline-none"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label>Alcobas:</label>
                    <select id="f-alcobas" class="w-full p-2 outline-none"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label>Baños:</label>
                    <select id="f-banos" class="w-full p-2 outline-none"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label>Precio desde:</label>
                    <input type="number" id="f-p-min" placeholder="Desde" class="w-full p-2 outline-none">
                </div>
                <div class="space-y-1">
                    <label>Precio hasta:</label>
                    <input type="number" id="f-p-max" placeholder="Hasta" class="w-full p-2 outline-none">
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="applyFilters()" class="btn-search px-14 py-3 uppercase text-sm tracking-widest shadow-xl">Buscar</button>
            </div>
        </div>
    </header>

    <section id="propiedades" class="container mx-auto py-20 px-4">
        <h2 class="text-3xl font-black uppercase text-center mb-12 italic">INMUEBLES <span class="text-monteclaro-blue">DESTACADOS</span></h2>
        <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </section>

    <section class="bg-black text-white py-12 px-4 border-t-4 border-monteclaro-blue">
        <div class="container mx-auto text-center">
            <h3 class="text-xl font-black mb-4 uppercase tracking-widest">Financial Group</h3>
            <p class="text-monteclaro-silver text-sm max-w-2xl mx-auto mb-6">
                Gestionamos su crédito con el SMMLV 2026 de $1.750.905. Subsidios hasta $52.527.150.
            </p>
            <a href="https://wa.me/57TUNUMERO" class="bg-monteclaro-blue px-8 py-3 font-bold uppercase text-[10px] tracking-widest">Consultar Crédito</a>
        </div>
    </section>

    <script>
        // BASE DE DATOS: Asegúrate de llenar todos estos campos para que los filtros funcionen
        const propiedades = [
            { id: 1, titulo: "Casa Campestre El Manzano", ciudad: "Pereira", localidad: "Centro", zona: "El Manzano", tipo: "Casa Campestre", estado: "Usado", negocio: "Venta", alcobas: 4, banos: 5, precio: 3800000000, area: 2500, imagen: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600" },
            { id: 2, titulo: "Hacienda Malabar", ciudad: "Pereira", localidad: "Cerritos", zona: "Malabar", tipo: "Casa Campestre", estado: "Nuevo", negocio: "Venta", alcobas: 6, banos: 7, precio: 11000000000, area: 5000, imagen: "https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=600" },
            { id: 3, titulo: "Apartamento Pinares", ciudad: "Pereira", localidad: "Pinares", zona: "Sector Norte", tipo: "Apartamento", estado: "Usado", negocio: "Renta", alcobas: 3, banos: 2, precio: 4500000, area: 120, imagen: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=600" }
        ];

        // Función que llena los 8 selectores automáticamente
        function populateFilters() {
            const fields = ['ciudad', 'localidad', 'zona', 'tipo', 'estado', 'negocio', 'alcobas', 'banos'];
            fields.forEach(field => {
                const list = [...new Set(propiedades.map(p => p[field]))].sort();
                const select = document.getElementById('f-' + field);
                list.forEach(item => {
                    select.innerHTML += `<option value="${item}">${item}</option>`;
                });
            });
        }

        function renderProperties(data) {
            const grid = document.getElementById('properties-grid');
            grid.innerHTML = '';
            if(data.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-20 font-bold uppercase text-gray-400">Sin resultados con estos filtros.</p>';
                return;
            }
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="property-card flex flex-col">
                        <img src="${p.imagen}" class="w-full h-48 object-cover border-b border-monteclaro-silver">
                        <div class="p-4 flex-grow">
                            <p class="text-xl font-black">$${p.precio.toLocaleString()} <span class="text-[9px] text-gray-400 uppercase">COP | ${p.negocio}</span></p>
                            <h4 class="text-monteclaro-blue font-bold text-xs mt-3 uppercase h-8 overflow-hidden">${p.titulo}</h4>
                            <p class="text-[10px] text-gray-500 mt-4 uppercase"><i class="fas fa-map-marker-alt text-black mr-1"></i> ${p.ciudad}, ${p.zona}</p>
                        </div>
                        <div class="grid grid-cols-3 text-center p-2 text-[9px] font-black uppercase border-t border-monteclaro-silver bg-slate-50">
                            <div class="border-r border-monteclaro-silver">Área m² <br>${p.area}</div>
                            <div class="border-r border-monteclaro-silver">Alcobas <br>${p.alcobas}</div>
                            <div>Baños <br>${p.banos}</div>
                        </div>
                    </div>
                `;
            });
        }

        function applyFilters() {
            const filters = {
                ciudad: document.getElementById('f-ciudad').value,
                localidad: document.getElementById('f-localidad').value,
                zona: document.getElementById('f-zona').value,
                tipo: document.getElementById('f-tipo').value,
                estado: document.getElementById('f-estado').value,
                negocio: document.getElementById('f-negocio').value,
                alcobas: document.getElementById('f-alcobas').value,
                banos: document.getElementById('f-banos').value,
                min: document.getElementById('f-p-min').value,
                max: document.getElementById('f-p-max').value
            };

            const filtered = propiedades.filter(p => {
                return (filters.ciudad === "" || p.ciudad === filters.ciudad) &&
                       (filters.localidad === "" || p.localidad === filters.localidad) &&
                       (filters.zona === "" || p.zona === filters.zona) &&
                       (filters.tipo === "" || p.tipo === filters.tipo) &&
                       (filters.estado === "" || p.estado === filters.estado) &&
                       (filters.negocio === "" || p.negocio === filters.negocio) &&
                       (filters.alcobas === "" || p.alcobas.toString() === filters.alcobas) &&
                       (filters.banos === "" || p.banos.toString() === filters.banos) &&
                       (filters.min === "" || p.precio >= parseInt(filters.min)) &&
                       (filters.max === "" || p.precio <= parseInt(filters.max));
            });

            renderProperties(filtered);
            window.location.href = "#propiedades";
        }

        populateFilters();
        renderProperties(propiedades);
    </script>
</body>
</html>
