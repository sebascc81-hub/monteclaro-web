<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monteclaro Inmobiliaria SAS | Portafolio 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-monteclaro-blue { background-color: #2638bf; }
        .text-monteclaro-blue { color: #2638bf; }
        .bg-monteclaro-silver { background-color: #b2b8bf; }
        .border-monteclaro-silver { border-color: #b2b8bf; }
        .nav-link { font-weight: 800; text-transform: uppercase; font-size: 0.85rem; color: #000000; transition: color 0.3s; }
        .nav-link:hover { color: #2638bf; }
        .property-card { border: 1px solid #b2b8bf; background: white; cursor: pointer; transition: 0.3s; }
        .property-card:hover { transform: translateY(-5px); }
        label { color: white; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        select, input { border-radius: 0px !important; font-weight: 600; font-size: 12px; height: 38px; }
        .hidden { display: none; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-white font-sans text-black">

    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-monteclaro-silver">
        <div class="container mx-auto px-4 py-6 flex flex-col lg:flex-row justify-between items-center gap-6 text-center lg:text-left">
            <h1 class="text-2xl font-black tracking-tighter cursor-pointer" onclick="window.location.href='index.html'">
                <span class="text-monteclaro-blue">MONTECLARO</span> <span class="text-black italic">SAS</span>
            </h1>
            <div class="flex flex-wrap justify-center gap-4 md:gap-8">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="#propiedades" class="nav-link">Ventas</a>
                <a href="#propiedades" class="nav-link">Alquileres</a>
                <a href="https://wa.me/57TUNUMERO" class="nav-link">Permutar</a>
                <a href="#" class="nav-link">Blog</a>
                <a href="#" class="nav-link">Nuestra Empresa</a>
                <a href="#contacto" class="nav-link">Contáctenos</a>
            </div>
        </div>
    </nav>

    <main id="main-view">
        <header id="inicio" class="bg-monteclaro-blue py-8 px-4 border-b-8 border-black">
            <div class="container mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4" id="filters-container"></div>
                <div class="mt-6 flex justify-end">
                    <button onclick="applyFilters()" class="bg-black text-white px-14 py-4 font-black uppercase text-xs tracking-widest shadow-xl hover:bg-white hover:text-black transition">Buscar Inmueble</button>
                </div>
            </div>
        </header>
        <section id="propiedades" class="container mx-auto py-20 px-4">
            <h2 class="text-3xl font-black uppercase text-center mb-12 italic tracking-tighter">INMUEBLES <span class="text-monteclaro-blue">DESTACADOS</span></h2>
            <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>
    </main>

    <main id="detail-view" class="hidden container mx-auto py-12 px-4">
        <button onclick="window.location.href='index.html'" class="mb-8 text-[10px] font-black uppercase border-b-2 border-black pb-1 hover:text-monteclaro-blue"><i class="fas fa-arrow-left mr-2"></i> Volver al Catálogo</button>
        <div id="detail-content"></div>
    </main>

    <section class="bg-black text-white py-16 px-4 border-t-8 border-monteclaro-blue text-center">
        <div class="container mx-auto">
            <h3 class="text-xl font-black mb-4 uppercase tracking-widest">Consultoría Monteclaro 2026</h3>
            <p class="text-monteclaro-silver text-[10px] max-w-2xl mx-auto leading-relaxed uppercase font-bold">
                Asesoría técnica: SMMLV $1.750.905. Subsidios hasta $52.527.150 para viviendas de hasta $262.635.000.
            </p>
        </div>
    </section>

    <script>
        const propiedades = [
            { 
                id: 1, 
                titulo: "Casa Campestre Cerritos - Malabar", 
                ciudad: "Pereira", localidad: "Cerritos", zona: "Malabar", 
                tipo: "Casa Campestre", estado: "Nuevo", negocio: "Venta", 
                alcobas: 5, banos: 6, precio: 3800000000, area: 4500,
                descripcion: "Exclusiva propiedad con amplias zonas verdes, acabados de lujo y máxima seguridad.",
                fotos: ["img/propiedad1/foto1.jpg", "img/propiedad1/foto2.jpg"],
                video: "https://www.youtube.com/embed/TU_VIDEO_ID_1"
            },
            { 
                id: 2, 
                titulo: "Apartamento VIS - Sector Cuba", 
                ciudad: "Pereira", localidad: "Cuba", zona: "Guadalupe", 
                tipo: "Apartamento", estado: "Nuevo", negocio: "Venta", 
                alcobas: 3, banos: 2, precio: 195000000, area: 55,
                descripcion: "Excelente oportunidad para estrenar. Apartamento apto para aplicación de subsidios 2026.",
                fotos: ["img/propiedad2/foto1.jpg"],
                video: "https://www.youtube.com/embed/TU_VIDEO_ID_2"
            }
        ];

        function checkRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) renderDetail(parseInt(id)); else renderHome();
        }

        function renderHome() {
            document.getElementById('main-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            populateFilters();
            renderGrid(propiedades);
        }

        function renderGrid(data) {
            const grid = document.getElementById('properties-grid');
            grid.innerHTML = '';
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="property-card flex flex-col h-full" onclick="window.location.search = '?id=${p.id}'">
                        <div class="h-48 overflow-hidden"><img src="${p.fotos[0]}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=Subiendo+Foto...'"></div>
                        <div class="p-5 flex-grow">
                            <p class="text-xl font-black">$${p.precio.toLocaleString()}</p>
                            <h4 class="text-monteclaro-blue font-bold text-[11px] mt-3 uppercase h-8 overflow-hidden">${p.titulo}</h4>
                            <p class="text-[9px] text-gray-400 mt-4 font-bold uppercase tracking-widest">${p.ciudad}, ${p.zona}</p>
                        </div>
                        <div class="grid grid-cols-3 text-center p-3 text-[9px] font-black border-t border-monteclaro-silver bg-slate-50 uppercase">
                            <div class="border-r border-monteclaro-silver">m² <br>${p.area}</div>
                            <div class="border-r border-monteclaro-silver">Hab <br>${p.alcobas}</div>
                            <div>Baños <br>${p.banos}</div>
                        </div>
                    </div>`;
            });
        }

        function renderDetail(id) {
            const p = propiedades.find(x => x.id === id);
            if (!p) return renderHome();
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            const dc = document.getElementById('detail-content');
            const esVIS = p.precio <= 262635750 ? `<div class="bg-green-100 text-green-800 p-4 text-[10px] font-black uppercase mb-6">Propiedad apta para gestión de subsidios 2026</div>` : '';

            dc.innerHTML = `
                <div class="grid lg:grid-cols-2 gap-12">
                    <div>
                        <img src="${p.fotos[0]}" class="w-full h-[500px] object-cover shadow-2xl mb-4" onerror="this.src='https://via.placeholder.com/800x600?text=Cargando+Imagen...'">
                        <div class="flex gap-2">${p.fotos.map(f => `<img src="${f}" class="h-20 w-20 object-cover border border-gray-200" onerror="this.style.display='none'">`).join('')}</div>
                    </div>
                    <div>
                        <h2 class="text-4xl font-black uppercase tracking-tightest leading-none">${p.titulo}</h2>
                        <p class="text-4xl font-black my-6">$${p.precio.toLocaleString()}</p>
                        ${esVIS}
                        <div class="grid grid-cols-3 gap-4 border-y border-gray-100 py-6 mb-8 text-center text-[10px] font-black uppercase">
                            <div>ÁREA <br><span class="text-lg text-monteclaro-blue">${p.area}m²</span></div>
                            <div class="border-x border-gray-100">HAB <br><span class="text-lg text-monteclaro-blue">${p.alcobas}</span></div>
                            <div>BAÑOS <br><span class="text-lg text-monteclaro-blue">${p.banos}</span></div>
                        </div>
                        <p class="text-gray-600 text-sm leading-relaxed mb-10">${p.descripcion}</p>
                        <a href="https://wa.me/57TUNUMERO?text=Interés en ID ${p.id}: ${p.titulo}" class="bg-black text-white w-full block text-center py-5 font-black uppercase text-xs tracking-widest shadow-2xl hover:bg-monteclaro-blue transition">Contactar Consultor Monteclaro</a>
                    </div>
                </div>`;
        }

        function populateFilters() {
            const c = document.getElementById('filters-container');
            const fields = ['ciudad', 'localidad', 'zona', 'tipo', 'estado', 'negocio', 'alcobas', 'banos'];
            c.innerHTML = '';
            fields.forEach(f => {
                const list = [...new Set(propiedades.map(p => p[f]))].sort();
                let opts = `<option value="">Todos</option>`;
                list.forEach(i => opts += `<option value="${i}">${i}</option>`);
                c.innerHTML += `<div class="space-y-1"><label>${f}:</label><select id="f-${f}" class="w-full p-2 outline-none">${opts}</select></div>`;
            });
            c.innerHTML += `<div class="space-y-1"><label>Precio Mín:</label><input type="number" id="f-min" class="w-full p-2 outline-none"></div>`;
            c.innerHTML += `<div class="space-y-1"><label>Precio Máx:</label><input type="number" id="f-max" class="w-full p-2 outline-none"></div>`;
        }

        function applyFilters() {
            const g = (id) => document.getElementById(id).value;
            const res = propiedades.filter(p => {
                return (g('f-ciudad') === "" || p.ciudad === g('f-ciudad')) &&
                       (g('f-negocio') === "" || p.negocio === g('f-negocio')) &&
                       (g('f-min') === "" || p.precio >= Number(g('f-min'))) &&
                       (g('f-max') === "" || p.precio <= Number(g('f-max')));
            });
            renderGrid(res);
            window.location.href = "#propiedades";
        }

        checkRoute();
    </script>
</body>
</html>
