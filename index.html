<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monteclaro Inmobiliaria SAS | Filtros Inteligentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-monteclaro-blue { background-color: #2638bf; }
        .text-monteclaro-blue { color: #2638bf; }
        .bg-monteclaro-silver { background-color: #b2b8bf; }
        .border-monteclaro-silver { border-color: #b2b8bf; }
        .nav-link { font-weight: 800; text-transform: uppercase; font-size: 0.85rem; color: #000000; transition: color 0.3s; }
        .nav-link:hover { color: #2638bf; }
        .property-card { border: 1px solid #b2b8bf; background: white; transition: transform 0.3s; }
        .property-card:hover { transform: translateY(-5px); }
        .btn-search { background-color: #000000; color: #ffffff; font-weight: 800; transition: all 0.3s; }
        .btn-search:hover { background-color: #b2b8bf; color: #000000; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-white font-sans text-black">

    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-monteclaro-silver">
        <div class="container mx-auto px-4 py-6 flex flex-col lg:flex-row justify-between items-center gap-6">
            <h1 class="text-2xl font-black tracking-tighter">
                <span class="text-monteclaro-blue">MONTECLARO</span> <span class="text-black italic">SAS</span>
            </h1>
            <div class="flex flex-wrap justify-center gap-4 md:gap-8">
                <a href="#inicio" class="nav-link">Inicio</a>
                <a href="#propiedades" class="nav-link">Ventas</a>
                <a href="#propiedades" class="nav-link">Alquileres</a>
                <a href="#" class="nav-link">Permutar</a>
                <a href="#" class="nav-link">Blog</a>
                <a href="#" class="nav-link">Nuestra Empresa</a>
                <a href="#contacto" class="nav-link">Contáctenos</a>
            </div>
        </div>
    </nav>

    <header id="inicio" class="bg-monteclaro-blue py-10 px-4 border-b-8 border-black">
        <div class="container mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="space-y-1">
                    <label class="text-white text-[10px] font-bold uppercase tracking-widest">Ciudad:</label>
                    <select id="select-city" class="w-full p-3 text-sm rounded-none outline-none font-bold italic border-r-4 border-black">
                        <option value="">Todas las ciudades</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-white text-[10px] font-bold uppercase tracking-widest">Localidad / Zona:</label>
                    <select id="select-locality" class="w-full p-3 text-sm rounded-none outline-none font-bold italic border-r-4 border-black">
                        <option value="">Todas las zonas</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-white text-[10px] font-bold uppercase tracking-widest">Tipo de Inmueble:</label>
                    <select id="select-type" class="w-full p-3 text-sm rounded-none outline-none font-bold italic border-r-4 border-black">
                        <option value="">Todos los tipos</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-white text-[10px] font-bold uppercase tracking-widest">Precio Máximo (COP):</label>
                    <input type="number" id="input-price" placeholder="Ej: 500000000" class="w-full p-3 text-sm rounded-none outline-none font-bold">
                </div>
            </div>
            <div class="mt-8 flex justify-end">
                <button onclick="applyFilters()" class="btn-search px-16 py-4 uppercase text-xs tracking-widest shadow-2xl">Filtrar Resultados</button>
            </div>
        </div>
    </header>

    <section id="propiedades" class="container mx-auto py-20 px-4">
        <h2 class="text-3xl font-black uppercase text-center mb-12">Portafolio <span class="text-monteclaro-blue">Monteclaro</span></h2>
        <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </section>

    <section class="bg-black text-white py-16 px-4 border-y-4 border-monteclaro-blue">
        <div class="container mx-auto text-center">
            <h3 class="text-2xl font-black mb-4 tracking-widest uppercase">Aliado Financial Group</h3>
            <p class="text-monteclaro-silver max-w-2xl mx-auto mb-8">
                Tramitamos tu crédito con el SMMLV 2026 de $1.750.905. Gestionamos subsidios de hasta 30 SMMLV para tu cuota inicial.
            </p>
            <a href="https://wa.me/57TUNUMERO" class="bg-monteclaro-blue text-white px-10 py-3 font-bold uppercase text-xs tracking-widest">Asesoría de Crédito</a>
        </div>
    </section>

    <script>
        // DATOS MAESTROS: Aquí es donde agregas tus propiedades reales
        const propiedades = [
            { id: 1, titulo: "Casa Campestre El Manzano", ciudad: "Pereira", localidad: "El Manzano", tipo: "Casa Campestre", negocio: "Venta", precio: 3800000000, imagen: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600" },
            { id: 2, titulo: "Apto Moderno Pinares", ciudad: "Pereira", localidad: "Pinares", tipo: "Apartamento", negocio: "Renta", precio: 4500000, imagen: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=600" },
            { id: 3, titulo: "Hacienda Malabar", ciudad: "Cerritos", localidad: "Malabar", tipo: "Casa Campestre", negocio: "Venta", precio: 11000000000, imagen: "https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=600" },
            { id: 4, titulo: "Hotel Boutique", ciudad: "Santa Rosa", localidad: "Termales", tipo: "Hotel", negocio: "Venta", precio: 2800000000, imagen: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600" }
        ];

        // Función para llenar los filtros automáticamente basándose en la lista de propiedades
        function populateFilters() {
            const cities = [...new Set(propiedades.map(p => p.ciudad))];
            const localities = [...new Set(propiedades.map(p => p.localidad))];
            const types = [...new Set(propiedades.map(p => p.tipo))];

            const fill = (id, list) => {
                const el = document.getElementById(id);
                list.forEach(item => {
                    el.innerHTML += `<option value="${item}">${item}</option>`;
                });
            };

            fill('select-city', cities);
            fill('select-locality', localities);
            fill('select-type', types);
        }

        function renderProperties(data) {
            const grid = document.getElementById('properties-grid');
            grid.innerHTML = '';
            if(data.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-10 font-bold uppercase">No se encontraron propiedades con esos criterios.</p>';
                return;
            }
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="property-card flex flex-col">
                        <img src="${p.imagen}" class="w-full h-60 object-cover border-b border-monteclaro-silver">
                        <div class="p-6">
                            <span class="text-[9px] font-black bg-black text-white px-3 py-1 uppercase tracking-widest">${p.negocio}</span>
                            <h4 class="text-monteclaro-blue font-bold text-sm mt-4 uppercase h-10 overflow-hidden">${p.titulo}</h4>
                            <p class="text-2xl font-black mt-2 leading-none">$${p.precio.toLocaleString()}</p>
                            <p class="text-[10px] text-gray-500 mt-4 uppercase font-bold"><i class="fas fa-map-marker-alt text-black mr-2"></i>${p.ciudad} - ${p.localidad}</p>
                        </div>
                    </div>
                `;
            });
        }

        function applyFilters() {
            const city = document.getElementById('select-city').value;
            const locality = document.getElementById('select-locality').value;
            const type = document.getElementById('select-type').value;
            const price = document.getElementById('input-price').value;

            const filtered = propiedades.filter(p => {
                return (city === "" || p.ciudad === city) &&
                       (locality === "" || p.localidad === locality) &&
                       (type === "" || p.tipo === type) &&
                       (price === "" || p.precio <= parseInt(price));
            });

            renderProperties(filtered);
            window.location.href = "#propiedades";
        }

        // Ejecución inicial
        populateFilters();
        renderProperties(propiedades);
    </script>
</body>
</html>
